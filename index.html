<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>poster — shared boards</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@500&family=Shantell+Sans:wght@500&display=swap" rel="stylesheet">
<style>
:root{
  --side:#1B1E22; --side-line:#2C3137; --canvas:#E9EDEA; --dot:#D3DAD5;
  --text:#D8DCE0; --muted:#8A939B; --accent:#6BA3BE; --ink:#2A2D31;
  --n1:#FBE38E; --n2:#F7C4CF; --n3:#BFE0F2; --n4:#CDE8C5; --n5:#E5D4F0; --n6:#F4D9B8;
  --p1:#1A1A1A; --p2:#D93636; --p3:#2263C2; --p4:#2E8B3A; --p5:#F07C1F;
}
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%}
body{background:var(--side);font-family:'IBM Plex Sans',sans-serif;font-size:14px;overflow:hidden;color:var(--ink)}
button{font:inherit;cursor:pointer}

/* ---------- auth ---------- */
#auth{position:fixed;inset:0;background:var(--side);display:flex;align-items:center;justify-content:center;z-index:50}
#auth .card{background:#22262B;border:1px solid var(--side-line);border-radius:14px;padding:28px 26px;width:320px;color:var(--text)}
#auth h1{font-family:'Shantell Sans',cursive;font-size:26px;color:var(--accent);margin-bottom:6px}
#auth p{color:var(--muted);font-size:13px;margin-bottom:16px}
#auth input{width:100%;background:#1A1D21;border:1px solid var(--side-line);color:var(--text);padding:10px 12px;border-radius:9px;font:inherit;margin-bottom:10px;outline:none}
#auth input:focus{border-color:var(--accent)}
#auth .btn{width:100%;background:var(--accent);border:none;color:#10222B;font-weight:600;padding:10px;border-radius:9px}
#authMsg{margin-top:10px;font-size:12.5px;min-height:16px;color:var(--muted)}
#authMsg.err{color:#E88}

/* ---------- app ---------- */
.app{display:flex;height:100%}
.side{width:220px;flex:none;background:var(--side);border-right:1px solid var(--side-line);padding:18px 14px;color:var(--text);display:flex;flex-direction:column;gap:14px}
.side h1{font-family:'Shantell Sans',cursive;font-size:22px;color:var(--accent)}
.formula{font-family:'IBM Plex Mono',monospace;font-size:11.5px;color:var(--muted)}
nav#boardList{display:flex;flex-direction:column;gap:6px;overflow-y:auto;flex:1}
nav#boardList button{background:transparent;border:none;color:var(--text);text-align:left;padding:8px 10px;border-radius:8px;font-size:13.5px}
nav#boardList button:hover{background:#262A2F}
nav#boardList button.sel{background:#2C3137;font-weight:600}
nav#boardList button input{width:100%;background:#262A2F;border:1px solid var(--side-line);color:var(--text);padding:6px 8px;border-radius:8px;font:inherit;outline:none}
.tools{display:flex;flex-direction:column;gap:8px}
.toolrow{display:flex;align-items:center;gap:8px}
.toolrow>button{width:32px;height:32px;flex:none;border-radius:8px;border:1px solid var(--side-line);background:#262A2F;color:var(--text);font-size:15px;text-align:center;line-height:1;padding:0}
.toolrow>button.on{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
#noteBtn{font-size:17px}
.swatches{display:flex;flex-wrap:nowrap;gap:5px;align-items:center}
.swatches button{width:16px;height:16px;border-radius:50%;border:2px solid transparent;flex:none;padding:0}
.swatches button.sel{border-color:var(--text)}
.side .out{background:transparent;border:1px solid var(--side-line);color:var(--muted);border-radius:8px;padding:7px;font-size:12.5px}

/* ---------- board ---------- */
.boardwrap{flex:1;position:relative;overflow:hidden}
#board{position:absolute;inset:0;background:var(--canvas);background-image:radial-gradient(var(--dot) 1.2px,transparent 1.2px);background-size:22px 22px}
.note{position:absolute;width:180px;min-height:150px;background:var(--n1);border-radius:3px;box-shadow:0 6px 14px rgba(30,40,35,.18);padding:12px;transform:rotate(var(--r,0deg));font-family:'Shantell Sans',cursive;font-size:15px;line-height:1.35}
.note .txt{outline:none;min-height:90px;word-wrap:break-word}
.note .handles{position:absolute;top:4px;right:4px;display:flex;gap:4px;opacity:0;transition:opacity .12s}
.note:hover .handles{opacity:1}
.note .handles button{width:20px;height:20px;border:none;border-radius:5px;background:rgba(0,0,0,.14);color:rgba(0,0,0,.6);font-size:12px;line-height:1;padding:0}
.note .sig{position:absolute;bottom:6px;right:9px;font-family:'IBM Plex Mono',monospace;font-size:10.5px;color:rgba(0,0,0,.45)}
.note .rs{position:absolute;right:0;bottom:0;width:14px;height:14px;cursor:nwse-resize}
.rs::after{content:"";position:absolute;right:3px;bottom:3px;width:7px;height:7px;border-right:2px solid rgba(0,0,0,.35);border-bottom:2px solid rgba(0,0,0,.35)}
.note.dragging{opacity:.85;box-shadow:0 14px 26px rgba(30,40,35,.28)}
#ink{position:absolute;inset:0;pointer-events:none;z-index:5}
</style>
</head>
<body>

var FIREBASE_CONFIG = {
  apiKey:            "AIzaSyAnjbNAgWYMg6_UTJ5jVg5KbrFztGqZ4Wg",
  authDomain:        "poster-b.firebaseapp.com",
  projectId:         "poster-b",
  storageBucket:     "poster-b.firebasestorage.app",
  messagingSenderId: "878190936636",
  appId:             "1:878190936636:web:9ef80a98a28821b8657939"
};

<script src="https://cdnjs.cloudflare.com/ajax/libs/firebase/10.12.2/firebase-app-compat.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/firebase/10.12.2/firebase-auth-compat.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/firebase/10.12.2/firebase-firestore-compat.min.js"></script>

<div id="auth">
  <div class="card">
    <h1>poster</h1>
    <p>Pick a username to claim your formula name and share boards.</p>
    <input id="uName" placeholder="username" autocomplete="off">
    <input id="uPass" type="password" placeholder="password">
    <button class="btn" id="btnAuth">Sign in / Create account</button>
    <div id="authMsg"></div>
  </div>
</div>

<div class="app" id="app" style="display:none">
  <aside class="side">
    <h1>poster</h1>
    <div class="you">
      <div>
        <div id="meName" style="font-weight:600"></div>
        <div class="formula" id="meFormula"></div>
      </div>
    </div>
    <nav id="boardList"></nav>
    <div class="tools">
      <div class="toolrow"><button id="penBtn">✏️</button><div class="swatches" id="penSwatches"></div></div>
      <div class="toolrow"><button id="noteBtn">+</button><div class="swatches" id="noteSwatches"></div></div>
    </div>
    <button class="out" id="shareBtn">Share this board</button>
    <button class="out" id="btnOut">Sign out</button>
  </aside>
  <div class="boardwrap">
    <div id="board"></div>
    <canvas id="ink"></canvas>
  </div>
</div>

<script>
(function(){
"use strict";

/* ---------- firebase ---------- */
firebase.initializeApp(FIREBASE_CONFIG);
var auth=firebase.auth(), db=firebase.firestore();

/* ---------- helpers ---------- */
function formulaFor(name){
  // deterministic "chemical formula" signature from the username
  var glyphs="CHONPSKFeMgCaNaCl", subs="₀₁₂₃₄₅₆₇₈₉";
  var h=0; for(var i=0;i<name.length;i++) h=(h*31+name.charCodeAt(i))>>>0;
  var s="",used=0;
  while(s.length<6&&used<4){
    var g=glyphs[h%glyphs.length]; h=Math.floor(h/7)+13;
    var n=h%4; h=Math.floor(h/3)+5;
    s+=g; if(n>0)s+=subs[n]; used++;
  }
  return s;
}

/* ---------- state ---------- */
var me=null, curBoard=null, boardsUnsub=null, boardsUnsub2=null, notesUnsub=null, boardDocs={};
var COLORS=["var(--n1)","var(--n2)","var(--n3)","var(--n4)","var(--n5)","var(--n6)"];
var PENS=[{c:"#1A1A1A"},{c:"#D93636"},{c:"#2263C2"},{c:"#2E8B3A"},{c:"#F07C1F"}];
var noteColor=0, penColor=PENS[0].c;
var liveNotes=[]; // {id, data, el, txt, sig}

var authEl=document.getElementById("auth"), appEl=document.getElementById("app");
var authMsg=document.getElementById("authMsg");

/* ---------- visible error reporting (so failures aren't silent) ---------- */
function showErr(msg){
  var t=document.createElement("div");
  t.style.cssText="position:fixed;left:50%;bottom:18px;transform:translateX(-50%);background:#3A2226;color:#F3C6C6;border:1px solid #7A4444;padding:8px 14px;border-radius:9px;font-size:12.5px;z-index:99;max-width:80%";
  t.textContent=msg;document.body.appendChild(t);
  setTimeout(function(){t.remove();},9000);
}
window.addEventListener("error",function(e){showErr("⚠ "+e.message);});
window.addEventListener("unhandledrejection",function(e){
  var r=e.reason||{};showErr("⚠ "+(r.code||r.message||"something failed silently"));
});
var boardListEl=document.getElementById("boardList");
var board=document.getElementById("board");
var penBtn=document.getElementById("penBtn"), noteBtn=document.getElementById("noteBtn");

/* ---------- auth ---------- */
function enter(u){
  me=u;
  authEl.style.display="none"; appEl.style.display="flex";
  document.getElementById("meName").textContent=u.name;
  document.getElementById("meFormula").textContent=u.formula;
  setTimeout(sizeInk,0); /* app just became visible — canvas was sized while hidden */
  listenBoards();
}

function doAuth(){
  var n=document.getElementById("uName").value.trim();
  var p=document.getElementById("uPass").value;
  authMsg.className=""; authMsg.textContent="";
  if(!n||!p){authMsg.className="err";authMsg.textContent="username and password, please";return;}
  if(p.length<6){authMsg.className="err";authMsg.textContent="password needs at least 6 characters (firebase rule)";return;}
  var email=n.toLowerCase()+"@poster.local";
  authMsg.textContent="…";
  db.collection("users").doc(n.toLowerCase()).get().then(function(doc){
    if(doc.exists){
      return auth.signInWithEmailAndPassword(email,p).then(function(){
        return db.collection("users").doc(n.toLowerCase()).get();
      });
    }
    return auth.createUserWithEmailAndPassword(email,p)
      .then(function(cred){
        var profile={name:n, formula:formulaFor(n), uid:cred.user.uid, createdAt:Date.now()};
        return db.collection("users").doc(n.toLowerCase()).set(profile).then(function(){return profile;});
      });
  }).then(function(profile){
    enter(profile);
  }).catch(function(e){
    authMsg.className="err";
    authMsg.textContent=(e.code==="auth/wrong-password"||e.code==="auth/invalid-credential"||e.code==="auth/user-not-found")?"wrong username or password":("auth error: "+e.code);
  });
}
document.getElementById("btnAuth").addEventListener("click",doAuth);
document.getElementById("uPass").addEventListener("keydown",function(e){if(e.key==="Enter")doAuth();});
document.getElementById("btnOut").addEventListener("click",function(){
  if(boardsUnsub)boardsUnsub(); if(boardsUnsub2)boardsUnsub2(); if(notesUnsub)notesUnsub();
  auth.signOut().then(function(){location.reload();});
});

/* ---------- boards (firestore) ---------- */
function listenBoards(){
  if(boardsUnsub)boardsUnsub();
  if(boardsUnsub2)boardsUnsub2();
  boardDocs={};
  var mine=me.name.toLowerCase();
  var qOwn=db.collection("boards").where("owner","==",mine);
  var qShared=db.collection("boards").where("shared","array-contains",mine);
  var apply=function(snap){
    snap.docChanges().forEach(function(ch){
      if(ch.type==="removed")delete boardDocs[ch.doc.id];
      else boardDocs[ch.doc.id]=ch.doc;
    });
    renderBoards(boardDocs);
    if(!curBoard){
      var ids=Object.keys(boardDocs);
      if(ids.length){loadBoard(ids[0]);}
      else{
        db.collection("boards").add({name:"main", owner:mine, updatedAt:Date.now()})
          .then(function(ref){loadBoard(ref.id);});
      }
    }
  };
  boardsUnsub=qOwn.onSnapshot(apply,function(e){showErr("boards sync error: "+e.code);});
  boardsUnsub2=qShared.onSnapshot(apply,function(e){showErr("shared boards sync error: "+e.code);});
}

function renderBoards(docs){
  boardListEl.innerHTML="";
  Object.keys(docs).forEach(function(id){
    var doc=docs[id];
    var b=document.createElement("button");
    b.textContent=doc.data().name||"untitled";
    if(id===curBoard)b.classList.add("sel");
    b.addEventListener("click",function(){loadBoard(id);});
    boardListEl.appendChild(b);
  });
  var nb=document.createElement("button");
  nb.textContent="+ new board";
  nb.addEventListener("click",function(){
    if(nb.querySelector("input"))return;
    nb.textContent="";
    var inp=document.createElement("input");
    inp.placeholder="board name…";
    nb.appendChild(inp);
    setTimeout(function(){inp.focus();},0);
    function make(){
      var name=inp.value.trim();
      if(!name){nb.textContent="+ new board";return;}
      db.collection("boards").add({name:name, owner:me.name.toLowerCase(), updatedAt:Date.now()})
        .then(function(ref){loadBoard(ref.id);});
    }
    inp.addEventListener("keydown",function(e){
      if(e.key==="Enter")make();
      if(e.key==="Escape")nb.textContent="+ new board";
    });
    inp.addEventListener("blur",function(){
      setTimeout(function(){ if(nb.contains(inp)&&!inp.value.trim())nb.textContent="+ new board"; },150);
    });
  });
  boardListEl.appendChild(nb);
}

/* ---------- notes (firestore live sync) ---------- */
function loadBoard(id){
  curBoard=id;
  if(notesUnsub)notesUnsub();
  board.querySelectorAll(".note").forEach(function(n){n.remove();});
  liveNotes=[]; clearInk();
  notesUnsub=db.collection("boards").doc(id).collection("notes").onSnapshot(function(snap){
    snap.docChanges().forEach(function(ch){
      if(ch.type==="removed"){
        var ex=liveNotes.find(function(x){return x.id===ch.doc.id;});
        if(ex){ex.el.remove(); liveNotes=liveNotes.filter(function(x){return x!==ex;});}
      }else{
        var ex2=liveNotes.find(function(x){return x.id===ch.doc.id;});
        if(ex2){updateNote(ex2,ch.doc.data());}
        else{addNote(ch.doc.id,ch.doc.data());}
      }
    });
  },function(e){showErr("notes sync error: "+e.code);});
}

function updateNote(entry,data){
  entry.data=data;
  entry.el.style.left=(data.x||80)+"px"; entry.el.style.top=(data.y||80)+"px";
  entry.el.style.background=COLORS[data.c||0];
  if(document.activeElement!==entry.txt){entry.txt.textContent=data.t||"";}
  entry.sig.textContent=data.sig||data.who||"";
}

function addNote(id,n){
  var el=document.createElement("div");
  el.className="note";
  el.style.left=(n.x||80)+"px"; el.style.top=(n.y||80)+"px";
  if(n.w)el.style.width=n.w+"px"; if(n.h)el.style.height=n.h+"px";
  el.style.setProperty("--r",((Math.random()*4)-2).toFixed(1)+"deg");
  el.style.background=COLORS[n.c||0];
  var hd=document.createElement("div");hd.className="handles";
  var cyc=document.createElement("button");cyc.textContent="✎";cyc.title="cycle color";
  var del=document.createElement("button");del.textContent="×";del.title="delete";
  hd.appendChild(cyc);hd.appendChild(del);el.appendChild(hd);
  var txt=document.createElement("div");txt.className="txt";txt.contentEditable="true";
  txt.textContent=n.t||"";el.appendChild(txt);
  var sig=document.createElement("div");sig.className="sig";
  sig.textContent=n.sig||n.who||"";el.appendChild(sig);
  var rs=document.createElement("div");rs.className="rs";el.appendChild(rs);
  board.appendChild(el);

  var entry={id:id,data:n,el:el,txt:txt,sig:sig};
  liveNotes.push(entry);
  var notesCol=function(){return db.collection("boards").doc(curBoard).collection("notes");};

  cyc.addEventListener("click",function(){
    notesCol().doc(id).update({c:((n.c||0)+1)%COLORS.length}).catch(function(e){showErr("couldn't change color: "+e.code);});
  });
  del.addEventListener("click",function(){
    notesCol().doc(id).delete().catch(function(e){showErr("couldn't delete note: "+e.code);});
  });
  txt.addEventListener("input",function(){
    var patch={t:txt.textContent};
    if(!n.sig&&!n.t&&me)patch.sig=me.formula;
    notesCol().doc(id).update(patch).catch(function(e){showErr("couldn't save note: "+e.code);});
  });

  /* drag */
  el.addEventListener("pointerdown",function(e){
    if(txt.contains(e.target)||rs.contains(e.target))return;
    var sx=e.clientX-el.offsetLeft, sy=e.clientY-el.offsetTop;
    el.setPointerCapture(e.pointerId); el.classList.add("dragging");
    function mv(ev){el.style.left=(ev.clientX-sx)+"px";el.style.top=(ev.clientY-sy)+"px";}
    function up(){
      el.releasePointerCapture(e.pointerId); el.classList.remove("dragging");
      el.removeEventListener("pointermove",mv);el.removeEventListener("pointerup",up);
      notesCol().doc(id).update({x:parseInt(el.style.left,10),y:parseInt(el.style.top,10)});
    }
    el.addEventListener("pointermove",mv);el.addEventListener("pointerup",up);
  });

  /* resize */
  rs.addEventListener("pointerdown",function(e){
    e.stopPropagation();
    var sw=e.clientX-el.offsetWidth, sh=e.clientY-el.offsetHeight;
    el.setPointerCapture(e.pointerId);
    function mv(ev){el.style.width=Math.max(120,ev.clientX-sw)+"px";el.style.height=Math.max(100,ev.clientY-sh)+"px";}
    function up(){
      el.releasePointerCapture(e.pointerId);
      el.removeEventListener("pointermove",mv);el.removeEventListener("pointerup",up);
      notesCol().doc(id).update({w:parseInt(el.style.width,10),h:parseInt(el.style.height,10)});
    }
    el.addEventListener("pointermove",mv);el.addEventListener("pointerup",up);
  });
}

noteBtn.addEventListener("click",function(){
  if(!me||!curBoard){showErr("no board selected — click a board first");return;}
  db.collection("boards").doc(curBoard).collection("notes").add({
    t:"",x:80+Math.random()*160,y:80+Math.random()*160,c:noteColor,who:me.formula
  }).catch(function(e){showErr("couldn't add note: "+e.code);});
});

/* ---------- swatches ---------- */
function buildSwatches(id,colors,onPick){
  var row=document.getElementById(id);
  colors.forEach(function(c,i){
    var b=document.createElement("button");
    b.style.background=c;
    if(i===0)b.classList.add("sel");
    b.addEventListener("click",function(){
      row.querySelectorAll("button").forEach(function(x){x.classList.remove("sel");});
      b.classList.add("sel"); onPick(i,b);
    });
    row.appendChild(b);
  });
}
buildSwatches("noteSwatches",COLORS.map(function(c){
  return getComputedStyle(document.documentElement).getPropertyValue(c.slice(4,-1)).trim();
}),function(i){noteColor=i;});
buildSwatches("penSwatches",PENS.map(function(p){return p.c;}),function(i){penColor=PENS[i].c;});

/* ---------- pen + eraser ---------- */
var canvas=document.getElementById("ink"), ictx=null, pen=false, erase=false, drawing=false, last=null;
function clearInk(){ictx=canvas.getContext("2d");ictx.clearRect(0,0,canvas.width,canvas.height);}
function sizeInk(){
  var r=board.getBoundingClientRect();
  canvas.width=r.width;canvas.height=r.height;
  canvas.style.width=r.width+"px";canvas.style.height=r.height+"px";
  ictx=canvas.getContext("2d");ictx.lineCap="round";ictx.lineJoin="round";
}
window.addEventListener("resize",sizeInk);

function setTool(){
  if(!canvas.width)sizeInk(); /* resize canvas if it was sized while the app was hidden */
  penBtn.classList.toggle("on",pen&&!erase);
  canvas.style.pointerEvents=(pen||erase)?"auto":"none";
  canvas.style.cursor=erase?"cell":"crosshair";
}
penBtn.addEventListener("click",function(){pen=!pen;if(pen)erase=false;setTool();});

/* eraser button (visible from the start) */
var eraseBtn=document.createElement("button");
eraseBtn.textContent="🧽";eraseBtn.title="eraser — drag over ink to rub it out";
eraseBtn.style.cssText="width:32px;height:32px;padding:0;font-size:15px;text-align:center;line-height:1;flex:none";
eraseBtn.addEventListener("click",function(){
  erase=!erase;eraseBtn.classList.toggle("on",erase);
  if(erase&&!pen)pen=true;
  setTool();
});
penBtn.parentNode.appendChild(eraseBtn);

canvas.addEventListener("pointerdown",function(e){
  drawing=true;canvas.setPointerCapture(e.pointerId);
  var r=board.getBoundingClientRect();
  last={x:e.clientX-r.left,y:e.clientY-r.top};
  if(erase){
    ictx.save();
    ictx.globalCompositeOperation="destination-out";
    ictx.beginPath();ictx.arc(last.x,last.y,12,0,Math.PI*2);ictx.fill();
    ictx.restore();
  }
});
canvas.addEventListener("pointermove",function(e){
  if(!drawing)return;
  var r=board.getBoundingClientRect();
  var p={x:e.clientX-r.left,y:e.clientY-r.top};
  if(erase){
    ictx.save();
    ictx.globalCompositeOperation="destination-out";
    ictx.lineWidth=24;ictx.lineCap="round";
    ictx.beginPath();ictx.moveTo(last.x,last.y);ictx.lineTo(p.x,p.y);ictx.stroke();
    ictx.restore();
  }else{
    ictx.strokeStyle=penColor;ictx.lineWidth=2.5;
    ictx.beginPath();ictx.moveTo(last.x,last.y);ictx.lineTo(p.x,p.y);ictx.stroke();
  }
  last=p;
});
canvas.addEventListener("pointerup",function(){drawing=false;});

/* hide the 6th note swatch so the toolbar stays compact */
var noteRow=document.getElementById("noteSwatches");
if(noteRow.children.length>5)noteRow.children[noteRow.children.length-1].style.display="none";

/* ---------- share board with existing usernames ---------- */
var shareBtn=document.getElementById("shareBtn");
shareBtn.addEventListener("click",function(){
  if(!me||!curBoard)return;
  var ov=document.createElement("div");
  ov.style.cssText="position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:60;display:flex;align-items:center;justify-content:center";
  var card=document.createElement("div");
  card.style.cssText="background:#22262B;border:1px solid var(--side-line);border-radius:14px;padding:20px;width:300px;color:var(--text)";
  var title=document.createElement("div");
  title.textContent="share this board";
  title.style.cssText="font-family:'Shantell Sans',cursive;font-size:18px;color:var(--accent);margin-bottom:10px";
  card.appendChild(title);
  var list=document.createElement("div");
  list.textContent="loading usernames…";
  list.style.fontSize="13px";
  card.appendChild(list);
  var close=document.createElement("button");
  close.textContent="done";

  card.appendChild(close);

  ov.addEventListener("click",function(e){if(e.target===ov)ov.remove();});
  db.collection("users").get().then(function(snap){
    list.innerHTML="";
    if(!snap.size){list.textContent="no users registered yet";return;}
    snap.forEach(function(doc){
      var u=doc.data();
      if(!u.name)return;
      var row=document.createElement("div");
      row.style.cssText="display:flex;justify-content:space-between;align-items:center;padding:6px 0";
      var nm=document.createElement("span");
      nm.textContent=u.name+(u.formula?" ("+u.formula+")":"");
      var add=document.createElement("button");
      add.textContent="add";
      add.style.cssText="background:#262A2F;border:1px solid var(--side-line);color:var(--text);border-radius:7px;padding:4px 10px;font-size:12px";
      add.addEventListener("click",function(){
        db.collection("boards").doc(curBoard).set(
          {shared:firebase.firestore.FieldValue.arrayUnion(u.name.toLowerCase())},
          {merge:true}
        );
        add.textContent="added ✓";add.disabled=true;add.style.opacity=.5;
      });
      row.appendChild(nm);row.appendChild(add);list.appendChild(row);
    });
  }).catch(function(e){list.textContent="couldn't load users ("+e.code+")";});
